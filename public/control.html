// Supabase

const SUPABASE_ANON_KEY =
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp3ZW9zZmZ4bGFnaG5ydmltZHd4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE5NDU0MDgsImV4cCI6MjA5NzUyMTQwOH0.7mlHv9Vl5mo0RLRFUfDB1D75L3OaHKoqpBNh0xfG2JE";

const supabase =
  createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY

// ==================================================
// Variables
// ==================================================

let ws = null;

let devices = [];

let schedules = [];

let currentUser = null;

let schedulerInterval = null;

let recognition = null;

let deviceModes =
  JSON.parse(
    localStorage.getItem("deviceModes") || "{}"
  );

let globalMode =
  localStorage.getItem("globalMode") || "manual";

// จำสถานะล่าสุดที่ Schedule ส่งสำเร็จ
let lastScheduleAction = {};

// ==================================================
// Authentication
// ==================================================

async function checkAuthAndLoad()
{
  const {
    data: { user }
  } = await supabase.auth.getUser();

  if (!user)
  {
    location.href = "index.html";
    return;
  }

  currentUser = user;

  const el =
    document.getElementById(
      "user-display"
    );

  if (el)
  {
    el.innerHTML =
      "👤 " + user.email;
  }

  await loadDevices();

  await loadSchedules();

  updateGlobalModeUI();

  connectWS();

  startScheduler();
}

// ==================================================
// Load Devices
// ==================================================

async function loadDevices()
{
  const {
    data,
    error
  } = await supabase
    .from("devices")
    .select("*")
    .eq(
      "user_id",
      currentUser.id
    )
    .order("created_at");

  if (error)
  {
    console.error(error);
    return;
  }

  devices = data || [];

  if (!devices.length)
  {
    renderDevices({});
    return;
  }

  const latestStatusMap = {};

  await Promise.all(
    devices.map(
      async d =>
      {
        const {
          data
        } = await supabase
          .from(
            "device_status_logs"
          )
          .select("status")
          .eq(
            "device_id",
            d.id
          )
          .order(
            "changed_at",
            {
              ascending: false
            }
          )
          .limit(1);

        latestStatusMap[d.id] =
          data &&
          data.length
            ? data[0].status === true
            : false;
      }
    )
  );

  renderDevices(
    latestStatusMap
  );

  updateDeviceScheduleUI();
}

// ==================================================
// Load Schedules
// ==================================================

async function loadSchedules()
{
  if (!devices.length)
  {
    schedules = [];
    renderScheduleList();
    return;
  }

  const deviceIds =
    devices.map(
      d => d.id
    );

  const {
    data,
    error
  } = await supabase
    .from("schedules")
    .select(
      "*, devices(id, name, pin)"
    )
    .in(
      "device_id",
      deviceIds
    );

  if (error)
  {
    console.error(error);
    return;
  }

  schedules = data || [];

  renderScheduleList();
}

// ==================================================
// Render Devices
// ==================================================

function renderDevices(
  latestStatusMap = {}
)
{
  const area =
    document.getElementById(
      "deviceArea"
    );

  area.innerHTML = `
    <div class="slot empty">ช่องที่ 1</div>
    <div class="slot empty">ช่องที่ 2</div>
    <div class="slot empty">ช่องที่ 3</div>
    <div class="slot empty">ช่องที่ 4</div>
    <div class="slot empty">ช่องที่ 5</div>
    <div class="slot empty">ช่องที่ 6</div>
    <div class="slot empty">ช่องที่ 7</div>
    <div class="slot empty">ช่องที่ 8</div>
  `;

  const selectEl =
    document.getElementById(
      "deviceSelect"
    );

  const currentSelectVal =
    selectEl
      ? selectEl.value
      : "";

  if (selectEl)
  {
    selectEl.innerHTML =
      '<option value="">เลือกอุปกรณ์เพื่อตั้งเวลา</option>';
  }

  devices.forEach(
    d =>
    {
      const slot =
        document.querySelector(
          ".slot.empty"
        );

      if (!slot)
        return;

      slot.classList.remove(
        "empty"
      );

      slot.dataset.deviceId =
        d.id;

      const isDeviceOn =
        latestStatusMap[d.id] === true;

      const btnClass =
        isDeviceOn
          ? "device on"
          : "device off";

      const btnText =
        isDeviceOn
          ? "ON"
          : "OFF";

      const currentMode =
        deviceModes[d.id] ||
        "manual";

      const modeBadge =
        currentMode === "auto"
          ? `<span style="background:#3498db;color:white;padding:3px 10px;border-radius:12px;font-size:12px;font-weight:600;">🤖 Auto</span>`
          : `<span style="background:#e67e22;color:white;padding:3px 10px;border-radius:12px;font-size:12px;font-weight:600;">🕹 Manual</span>`;

      let disabledStyle = "";

      if (
        globalMode === "auto"
      )
      {
        disabledStyle =
          "opacity:0.5;cursor:not-allowed;filter:grayscale(50%);";
      }

      slot.innerHTML = `
        <button
          class="deleteBtn"
          onclick="deleteDevice('${d.id}')"
        >
          ✕
        </button>

        <h3 style="margin-bottom:6px;">
          ${d.name}
        </h3>

        <div style="margin-bottom:10px;">
          ตารางเวลา: ${modeBadge}
        </div>

        <button
          class="${btnClass}"
          style="${disabledStyle}"
          id="btn-${d.id}"
          onclick="toggleDevice('${d.id}','${d.pin}')"
        >
          ${btnText}
        </button>

        <div style="margin-top:6px;">
          GPIO ${d.pin}
        </div>

        <div>
          🎤 เปิด : ${d.on_key}
        </div>

        <div>
          🎤 ปิด : ${d.off_key}
        </div>
      `;

      if (selectEl)
      {
        selectEl.innerHTML +=
          `<option value="${d.id}">
            ${d.name}
          </option>`;
      }
    }
  );

  if (
    selectEl &&
    currentSelectVal
  )
  {
    selectEl.value =
      currentSelectVal;
  }
}

// ==================================================
// Schedule List
// ==================================================

function renderScheduleList()
{
  const list =
    document.getElementById(
      "scheduleList"
    );

  if (!list)
    return;

  if (!schedules.length)
  {
    list.innerHTML = "";
    return;
  }

  list.innerHTML =
    `<div style="margin-top:12px;font-size:13px;color:#555;font-weight:600">
      รายการเวลาที่ตั้งไว้
    </div>`;

  schedules.forEach(
    s =>
    {
      const name =
        s.devices?.name ||
        "ไม่ทราบชื่อ";

      list.innerHTML += `
        <div class="schedule-item">

          <span>
            🔧 ${name}
            — เปิด ${s.time_on}
            / ปิด ${s.time_off}
          </span>

          <button
            class="del"
            onclick="deleteSchedule('${s.device_id}')"
          >
            🗑
          </button>

        </div>
      `;
    }
  );
}

// ==================================================
// Time Functions
// ==================================================

function getCurrentTime()
{
  const now = new Date();

  return (
    now.getHours()
      .toString()
      .padStart(2, "0")
    +
    ":"
    +
    now.getMinutes()
      .toString()
      .padStart(2, "0")
  );
}

function timeToMinutes(time)
{
  if (!time)
    return -1;

  const clean =
    time.substring(0, 5);

  const parts =
    clean.split(":");

  const h =
    Number(parts[0]);

  const m =
    Number(parts[1]);

  if (
    Number.isNaN(h) ||
    Number.isNaN(m)
  )
  {
    return -1;
  }

  return h * 60 + m;
}

// ==================================================
// Is Time In Schedule
// ==================================================

function isTimeInSchedule(
  current,
  timeOn,
  timeOff
)
{
  const now =
    timeToMinutes(current);

  const on =
    timeToMinutes(timeOn);

  const off =
    timeToMinutes(timeOff);

  if (
    now < 0 ||
    on < 0 ||
    off < 0
  )
  {
    return false;
  }

  if (on === off)
  {
    return false;
  }

  // เช่น 08:00 -> 18:00
  if (on < off)
  {
    return (
      now >= on &&
      now < off
    );
  }

  // เช่น 22:00 -> 06:00
  return (
    now >= on ||
    now < off
  );
}

// ==================================================
// Send Device State
// ==================================================

async function setDeviceState(
  id,
  pin,
  targetState,
  fromSchedule = false
)
{
  if (
    !ws ||
    ws.readyState !== WebSocket.OPEN
  )
  {
    console.warn(
      "[WS] ยังไม่เชื่อมต่อ ไม่ส่งคำสั่ง"
    );

    showSchedulerStatus(
      "⚠️ WebSocket ยังไม่เชื่อมต่อ"
    );

    return false;
  }

  const command =
  {
    type: "control",
    device: String(pin),
    status: targetState,
    isSchedule: fromSchedule
  };

  try
  {
    ws.send(
      JSON.stringify(command)
    );
  }
  catch (err)
  {
    console.error(
      "[WS] Send error",
      err
    );

    return false;
  }

  // เปลี่ยน UI
  const btn =
    document.getElementById(
      "btn-" + id
    );

  if (btn)
  {
    if (
      targetState === "on"
    )
    {
      btn.className =
        "device on";

      btn.innerHTML =
        "ON";
    }
    else
    {
      btn.className =
        "device off";

      btn.innerHTML =
        "OFF";
    }
  }

  // เก็บประวัติ
  const {
    error
  } = await supabase
    .from(
      "device_status_logs"
    )
    .insert([
      {
        device_id: id,
        status:
          targetState === "on"
      }
    ]);

  if (error)
  {
    console.error(
      "[Supabase] Log error",
      error
    );
  }

  return true;
}

// ==================================================
// Manual Toggle
// ==================================================

window.toggleDevice =
  async (
    id,
    pin
  ) =>
{
  if (
    globalMode === "auto"
  )
  {
    alert(
      "ระบบอยู่ในโหมด Auto ไม่สามารถควบคุมด้วยตนเองได้"
    );

    return;
  }

  const btn =
    document.getElementById(
      "btn-" + id
    );

  if (!btn)
    return;

  const targetState =
    btn.classList.contains(
      "on"
    )
      ? "off"
      : "on";

  await setDeviceState(
    id,
    pin,
    targetState,
    false
  );
};

// ==================================================
// CHECK SCHEDULES
// ==================================================

async function checkSchedules()
{
  if (!devices.length)
    return;

  const currentTime =
    getCurrentTime();

  for (const s of schedules)
  {
    const device =
      s.devices;

    if (!device)
      continue;

    const mode =
      deviceModes[device.id] ||
      "manual";

    if (mode !== "auto")
      continue;

    const timeOn =
      s.time_on
        ? s.time_on.substring(0, 5)
        : "";

    const timeOff =
      s.time_off
        ? s.time_off.substring(0, 5)
        : "";

    if (
      !timeOn ||
      !timeOff
    )
    {
      continue;
    }

    const active =
      isTimeInSchedule(
        currentTime,
        timeOn,
        timeOff
      );

    const targetState =
      active
        ? "on"
        : "off";

    const lastState =
      lastScheduleAction[
        device.id
      ];

    // --------------------------------------------
    // ยังไม่ต้องส่งซ้ำ
    // --------------------------------------------

    if (
      lastState === targetState
    )
    {
      continue;
    }

    console.log(
      `[SCHEDULE] ${device.name} -> ${targetState.toUpperCase()}`
    );

    // --------------------------------------------
    // ถ้า WebSocket ยังไม่พร้อม
    // ห้ามจำว่าได้ส่งแล้ว
    // --------------------------------------------

    const success =
      await setDeviceState(
        device.id,
        device.pin,
        targetState,
        true
      );

    if (!success)
    {
      console.log(
        "[SCHEDULE] ส่งไม่สำเร็จ จะลองใหม่"
      );

      continue;
    }

    // --------------------------------------------
    // บันทึกหลังส่งสำเร็จเท่านั้น
    // --------------------------------------------

    lastScheduleAction[
      device.id
    ] = targetState;

    showSchedulerStatus(
      `⏰ ${
        active
          ? "เปิด"
          : "ปิด"
      } ${device.name} อัตโนมัติ`
    );
  }
}

// ==================================================
// Scheduler
// ==================================================

function startScheduler()
{
  if (schedulerInterval)
  {
    clearInterval(
      schedulerInterval
    );
  }

  // ตรวจทันที
  checkSchedules();

  // ตรวจทุก 1 วินาที
  schedulerInterval =
    setInterval(
      () =>
      {
        checkSchedules();
      },
      1000
    );
}

// ==================================================
// Scheduler Status
// ==================================================

function showSchedulerStatus(msg)
{
  const el =
    document.getElementById(
      "schedulerStatus"
    );

  if (!el)
    return;

  el.textContent =
    msg;

  el.style.opacity =
    "1";

  setTimeout(
    () =>
    {
      el.style.opacity =
        "0";
    },
    3000
  );
}

// ==================================================
// Save Schedule
// ==================================================

window.saveSchedule =
  async () =>
{
  const deviceId =
    document.getElementById(
      "deviceSelect"
    ).value;

  const onTime =
    document.getElementById(
      "timeOn"
    ).value;

  const offTime =
    document.getElementById(
      "timeOff"
    ).value;

  const statusEl =
    document.getElementById(
      "scheduleStatus"
    );

  if (
    !deviceId ||
    !onTime ||
    !offTime
  )
  {
    alert(
      "กรอกข้อมูลให้ครบ"
    );

    return;
  }

  if (
    onTime === offTime
  )
  {
    alert(
      "เวลาเปิดและเวลาปิดต้องไม่เหมือนกัน"
    );

    return;
  }

  // --------------------------------------------
  // ลบตารางเดิม
  // --------------------------------------------

  const {
    error: deleteError
  } = await supabase
    .from("schedules")
    .delete()
    .eq(
      "device_id",
      deviceId
    );

  if (deleteError)
  {
    alert(
      deleteError.message
    );

    return;
  }

  // --------------------------------------------
  // เพิ่มตารางใหม่
  // --------------------------------------------

  const {
    error
  } = await supabase
    .from("schedules")
    .insert([
      {
        device_id:
          deviceId,

        time_on:
          onTime,

        time_off:
          offTime
      }
    ]);

  if (error)
  {
    alert(
      error.message
    );

    return;
  }

  // --------------------------------------------
  // เปิด Schedule
  // --------------------------------------------

  deviceModes[
    deviceId
  ] = "auto";

  localStorage.setItem(
    "deviceModes",
    JSON.stringify(
      deviceModes
    )
  );

  // บังคับให้ตรวจใหม่
  delete lastScheduleAction[
    deviceId
  ];

  await loadSchedules();

  updateDeviceScheduleUI();

  renderDevices();

  await checkSchedules();

  if (statusEl)
  {
    statusEl.innerHTML =
      "✅ บันทึกเวลาเรียบร้อย";

    setTimeout(
      () =>
      {
        statusEl.innerHTML =
          "";
      },
      3000
    );
  }
};

// ==================================================
// Delete Schedule
// ==================================================

window.deleteSchedule =
  async deviceId =>
{
  if (
    !confirm(
      "ลบตารางเวลานี้?"
    )
  )
  {
    return;
  }

  const device =
    devices.find(
      d => d.id === deviceId
    );

  // ถ้าอุปกรณ์กำลังเปิดจาก Schedule
  // ให้สั่ง OFF ก่อน
  if (
    device &&
    deviceModes[deviceId] === "auto"
  )
  {
    const schedule =
      schedules.find(
        s =>
          s.device_id ===
          deviceId
      );

    if (schedule)
    {
      const active =
        isTimeInSchedule(
          getCurrentTime(),
          schedule.time_on,
          schedule.time_off
        );

      if (active)
      {
        await setDeviceState(
          device.id,
          device.pin,
          "off",
          true
        );
      }
    }
  }

  await supabase
    .from("schedules")
    .delete()
    .eq(
      "device_id",
      deviceId
    );

  deviceModes[
    deviceId
  ] = "manual";

  localStorage.setItem(
    "deviceModes",
    JSON.stringify(
      deviceModes
    )
  );

  delete lastScheduleAction[
    deviceId
  ];

  await loadSchedules();

  updateDeviceScheduleUI();

  renderDevices();

  showSchedulerStatus(
    "🗑 ลบตารางเวลาแล้ว"
  );
};

// ==================================================
// Global Mode UI
// ==================================================

function updateGlobalModeUI()
{
  const autoBtn =
    document.getElementById(
      "globalModeAutoBtn"
    );

  const manualBtn =
    document.getElementById(
      "globalModeManualBtn"
    );

  const modeText =
    document.getElementById(
      "globalModeText"
    );

  if (
    globalMode === "auto"
  )
  {
    if (autoBtn)
      autoBtn.style.background =
        "#2ecc71";

    if (manualBtn)
      manualBtn.style.background =
        "#7f8c8d";

    if (modeText)
      modeText.innerHTML =
        "โหมดภาพรวม: 🤖 Auto";
  }
  else
  {
    if (autoBtn)
      autoBtn.style.background =
        "#7f8c8d";

    if (manualBtn)
      manualBtn.style.background =
        "#e67e22";

    if (modeText)
      modeText.innerHTML =
        "โหมดภาพรวม: 🕹 Manual";
  }

  devices.forEach(
    d =>
    {
      const btn =
        document.getElementById(
          "btn-" + d.id
        );

      if (!btn)
        return;

      if (
        globalMode === "auto"
      )
      {
        btn.style.cssText =
          "opacity:0.5;cursor:not-allowed;filter:grayscale(50%);";
      }
      else
      {
        btn.style.cssText =
          "";
      }
    }
  );
}

// ==================================================
// Change Global Mode
// ==================================================

window.changeGlobalMode =
  mode =>
{
  globalMode =
    mode;

  localStorage.setItem(
    "globalMode",
    globalMode
  );

  updateGlobalModeUI();

  if (
    ws &&
    ws.readyState ===
      WebSocket.OPEN
  )
  {
    ws.send(
      JSON.stringify({
        type: "control",
        mode: mode
      })
    );
  }

  showSchedulerStatus(
    `เปลี่ยนโหมดเป็น ${
      mode === "auto"
        ? "Auto"
        : "Manual"
    }`
  );
};

// ==================================================
// Device Schedule UI
// ==================================================

function updateDeviceScheduleUI()
{
  const deviceId =
    document.getElementById(
      "deviceSelect"
    ).value;

  const autoBtn =
    document.getElementById(
      "scheduleAutoBtn"
    );

  const manualBtn =
    document.getElementById(
      "scheduleManualBtn"
    );

  const modeText =
    document.getElementById(
      "deviceScheduleModeText"
    );

  if (!deviceId)
  {
    autoBtn.style.background =
      "#7f8c8d";

    manualBtn.style.background =
      "#7f8c8d";

    modeText.innerHTML =
      "สถานะตารางเวลาอุปกรณ์: -";

    return;
  }

  const currentMode =
    deviceModes[deviceId] ||
    "manual";

  if (
    currentMode === "auto"
  )
  {
    autoBtn.style.background =
      "#3498db";

    manualBtn.style.background =
      "#7f8c8d";

    modeText.innerHTML =
      "สถานะตารางเวลาอุปกรณ์: เปิดใช้งานตารางเวลา";
  }
  else
  {
    autoBtn.style.background =
      "#7f8c8d";

    manualBtn.style.background =
      "#e67e22";

    modeText.innerHTML =
      "สถานะตารางเวลาอุปกรณ์: ปิดใช้งานตารางเวลา";
  }
}

// ==================================================
// Change Device Schedule Mode
// ==================================================

window.changeDeviceScheduleMode =
  async mode =>
{
  const deviceId =
    document.getElementById(
      "deviceSelect"
    ).value;

  if (!deviceId)
  {
    alert(
      "กรุณาเลือกอุปกรณ์ก่อน"
    );

    return;
  }

  const device =
    devices.find(
      d => d.id === deviceId
    );

  // --------------------------------------------
  // ถ้าปิด Schedule
  // และอุปกรณ์กำลังอยู่ในช่วงเวลา
  // ให้ OFF ก่อน
  // --------------------------------------------

  if (
    mode === "manual" &&
    device &&
    deviceModes[deviceId] === "auto"
  )
  {
    const schedule =
      schedules.find(
        s =>
          s.device_id ===
          deviceId
      );

    if (schedule)
    {
      const active =
        isTimeInSchedule(
          getCurrentTime(),
          schedule.time_on,
          schedule.time_off
        );

      if (active)
      {
        await setDeviceState(
          device.id,
          device.pin,
          "off",
          true
        );
      }
    }
  }

  deviceModes[
    deviceId
  ] = mode;

  localStorage.setItem(
    "deviceModes",
    JSON.stringify(
      deviceModes
    )
  );

  delete lastScheduleAction[
    deviceId
  ];

  updateDeviceScheduleUI();

  renderDevices();

  if (
    mode === "auto"
  )
  {
    await checkSchedules();

    showSchedulerStatus(
      "⏰ เปิดใช้งานตารางเวลาแล้ว"
    );
  }
  else
  {
    showSchedulerStatus(
      "🕹 ปิดใช้งานตารางเวลาแล้ว"
    );
  }
};

// ==================================================
// WebSocket
// ==================================================

function connectWS()
{
  if (
    ws &&
    (
      ws.readyState ===
        WebSocket.OPEN ||
      ws.readyState ===
        WebSocket.CONNECTING
    )
  )
  {
    return;
  }

  console.log(
    "[WS] Connecting..."
  );

  ws =
    new WebSocket(
      "wss://smartfarm-web.onrender.com"
    );

  ws.onopen =
    () =>
    {
      console.log(
        "[WS] Connected"
      );

      ws.send(
        JSON.stringify({
          type: "web"
        })
      );

      setTimeout(
        () =>
        {
          if (
            ws &&
            ws.readyState ===
              WebSocket.OPEN
          )
          {
            ws.send(
              JSON.stringify({
                type: "control",
                mode: globalMode
              })
            );

            // ตรวจ Schedule ทันที
            delete lastScheduleAction;

            checkSchedules();
          }
        },
        500
      );
    };

  ws.onmessage =
    event =>
    {
      try
      {
        const data =
          JSON.parse(
            event.data
          );

        // ----------------------------------------
        // Sensor / Status
        // ----------------------------------------

        if (
          data.type ===
            "status" ||
          data.type ===
            "sensor"
        )
        {
          if (
            data.temperature !==
            undefined
          )
          {
            const temp =
              parseFloat(
                data.temperature
              );

            document.getElementById(
              "displayTemp"
            ).innerHTML =
              temp > 0
                ? temp.toFixed(1) +
                  " °C"
                : "-- °C";
          }

          if (
            data.food_level !==
            undefined
          )
          {
            document.getElementById(
              "displayFood"
            ).innerHTML =
              data.food_level +
              " %";
          }

          if (
            data.water_level !==
            undefined
          )
          {
            document.getElementById(
              "displayWater"
            ).innerHTML =
              data.water_level +
              " %";
          }

          devices.forEach(
            d =>
            {
              const btn =
                document.getElementById(
                  "btn-" + d.id
                );

              if (!btn)
                return;

              const pin =
                Number(d.pin);

              let isDeviceOn =
                false;

              if (pin === 17)
                isDeviceOn =
                  data.light === true;

              else if (pin === 16)
                isDeviceOn =
                  data.fan1 === true;

              else if (pin === 5)
                isDeviceOn =
                  data.fan2 === true;

              else if (pin === 21)
                isDeviceOn =
                  data.pump1 === true;

              else if (pin === 19)
                isDeviceOn =
                  data.pump2 === true;

              else if (pin === 18)
                isDeviceOn =
                  data.motor === true;

              else
                return;

              if (isDeviceOn)
              {
                btn.className =
                  "device on";

                btn.innerHTML =
                  "ON";
              }
              else
              {
                btn.className =
                  "device off";

                btn.innerHTML =
                  "OFF";
              }

              if (
                globalMode ===
                "auto"
              )
              {
                btn.style.cssText =
                  "opacity:0.5;cursor:not-allowed;filter:grayscale(50%);";
              }
              else
              {
                btn.style.cssText =
                  "";
              }
            }
          );
        }

        // ----------------------------------------
        // Mode
        // ----------------------------------------

        if (
          data.type ===
          "mode_status"
        )
        {
          if (
            data.mode ===
              "auto" ||
            data.mode ===
              "manual"
          )
          {
            globalMode =
              data.mode;

            localStorage.setItem(
              "globalMode",
              globalMode
            );

            updateGlobalModeUI();
          }
        }

      }
      catch (e)
      {
        console.error(
          "[WS] JSON Error",
          e
        );
      }
    };

  ws.onerror =
    error =>
    {
      console.error(
        "[WS] Error",
        error
      );
    };

  ws.onclose =
    () =>
    {
      console.log(
        "[WS] Closed - reconnect 5 sec"
      );

      ws = null;

      setTimeout(
        () =>
        {
          connectWS();
        },
        5000
      );
    };
}

// ==================================================
// Add Device
// ==================================================

window.addDevice =
  async () =>
{
  const name =
    document.getElementById(
      "deviceName"
    ).value.trim();

  const on =
    document.getElementById(
      "onKey"
    ).value.trim();

  const off =
    document.getElementById(
      "offKey"
    ).value.trim();

  const pin =
    document.getElementById(
      "pinInput"
    ).value.trim();

  if (
    !name ||
    !on ||
    !off ||
    !pin
  )
  {
    alert(
      "กรอกข้อมูลให้ครบ"
    );

    return;
  }

  const {
    error
  } = await supabase
    .from("devices")
    .insert([
      {
        user_id:
          currentUser.id,

        name,

        on_key:
          on,

        off_key:
          off,

        pin
      }
    ]);

  if (error)
  {
    alert(
      error.message
    );

    return;
  }

  document.getElementById(
    "deviceName"
  ).value = "";

  document.getElementById(
    "onKey"
  ).value = "";

  document.getElementById(
    "offKey"
  ).value = "";

  document.getElementById(
    "pinInput"
  ).value = "";

  await loadDevices();

  await loadSchedules();
};

// ==================================================
// Delete Device
// ==================================================

window.deleteDevice =
  async id =>
{
  if (
    !confirm(
      "ลบอุปกรณ์นี้?"
    )
  )
  {
    return;
  }

  await supabase
    .from("schedules")
    .delete()
    .eq(
      "device_id",
      id
    );

  await supabase
    .from("devices")
    .delete()
    .eq(
      "id",
      id
    );

  delete deviceModes[id];

  localStorage.setItem(
    "deviceModes",
    JSON.stringify(
      deviceModes
    )
  );

  delete lastScheduleAction[
    id
  ];

  await loadDevices();

  await loadSchedules();
};

// ==================================================
// Voice
// ==================================================

window.startVoice =
  async () =>
{
  const voiceBtn =
    document.getElementById(
      "voiceButton"
    );

  const voiceText =
    document.getElementById(
      "voiceText"
    );

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!SpeechRecognition)
  {
    voiceText.innerHTML =
      "❌ อุปกรณ์ไม่รองรับการสั่งงานด้วยเสียง";

    return;
  }

  try
  {
    await navigator.mediaDevices
      .getUserMedia({
        audio: true
      });
  }
  catch (err)
  {
    voiceText.innerHTML =
      "❌ กรุณาอนุญาตสิทธิ์ไมโครโฟน";

    return;
  }

  if (recognition)
  {
    try
    {
      recognition.abort();
    }
    catch (e) {}
  }

  recognition =
    new SpeechRecognition();

  recognition.lang =
    "th-TH";

  recognition.interimResults =
    false;

  recognition.maxAlternatives =
    1;

  recognition.continuous =
    false;

  recognition.onstart =
    () =>
    {
      voiceBtn.classList.add(
        "listening"
      );

      voiceBtn.innerHTML =
        "🔊 กำลังฟังคำสั่งเสียง...";

      voiceText.innerHTML =
        "พูดคำสั่งเปิด/ปิดอุปกรณ์";
    };

  recognition.onresult =
    async event =>
    {
      const text =
        event.results[0][0]
          .transcript
          .trim()
          .toLowerCase();

      voiceText.innerHTML =
        `ได้ยินเสียง: "${text}"`;

      if (
        globalMode ===
        "auto"
      )
      {
        voiceText.innerHTML =
          "⚠️ ไม่สามารถสั่งงานด้วยเสียงในโหมด Auto";

        return;
      }

      let matched =
        false;

      for (
        const d of devices
      )
      {
        const onKey =
          d.on_key
            .trim()
            .toLowerCase();

        const offKey =
          d.off_key
            .trim()
            .toLowerCase();

        if (
          text === onKey
        )
        {
          await setDeviceState(
            d.id,
            d.pin,
            "on",
            false
          );

          matched = true;

          break;
        }

        if (
          text === offKey
        )
        {
          await setDeviceState(
            d.id,
            d.pin,
            "off",
            false
          );

          matched = true;

          break;
        }
      }

      if (!matched)
      {
        voiceText.innerHTML =
          `ได้ยิน: "${text}" ไม่พบคำสั่ง`;
      }
    };

  recognition.onerror =
    () =>
    {
      voiceText.innerHTML =
        "❌ เกิดข้อผิดพลาด กรุณาลองอีกครั้ง";
    };

  recognition.onend =
    () =>
    {
      voiceBtn.classList.remove(
        "listening"
      );

      voiceBtn.innerHTML =
        "🎤 เริ่มฟังคำสั่ง";
    };

  try
  {
    recognition.start();
  }
  catch (e) {}
};
